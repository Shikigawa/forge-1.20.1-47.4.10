services:
  mc:
    image: itzg/minecraft-server:stable-java17
    tty: true
    stdin_open: true
    restart: always
    ports:
      - "25565:25565"
      - "25575:25575"
    env_file:
        - .env
    volumes:
      - ./data:/data
      - ./mods:/mods
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '6' # Выделяем 6 потоков из ваших 24-х
        reservations:
          memory: 10G
          cpus: '4' # Гарантированный минимум

